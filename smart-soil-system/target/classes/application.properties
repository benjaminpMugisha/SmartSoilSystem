# Smart Soil System - Application Configuration
# AUCA SENG 8240 - Benjamin Mugisha Prince 26979

spring.application.name=smart-soil-system

# ── H2 In-Memory Database (Prototype / Dev)
spring.datasource.url=jdbc:h2:mem:smart_soil_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=rab_admin
spring.datasource.password=rab_pass
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ── Server
server.port=8080

# ── JWT
app.jwt.secret=SmartSoilRABSecretKey2025_AUCA_SENG8240_BenjaminMugisha26979_LongSecretForHMAC
app.jwt.expiration=86400000

# ── Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ── Logging
logging.level.com.rab.smartsoil=DEBUG
logging.level.org.springframework.security=WARN
